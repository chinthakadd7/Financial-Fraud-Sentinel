version: '3.8'

services:

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: fraud-sentinel-api
    ports:
      - "8000:8000"

    environment:
      # Application settings
      - APP_NAME=Financial Fraud Sentinel API
      - VERSION=1.0.0
      - ENVIRONMENT=production
      - DEBUG=false
      
      # API configuration
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:10101,http://dashboard:10101
      
      # Model configuration
      - MODEL_PATH=models_artifacts/XGBoost_1_AutoML_1_20260209_165338.zip
      - MODEL_NAME=XGBoost_1_AutoML_1_20260209_165338
      
      # H2O configuration (prevent OOM)
      - H2O_MEMORY_GB=1
      - H2O_PORT=54321
      - H2O_NTHREADS=-1
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LOG_FILE=/app/logs/api.log

    volumes:
      - ./models_artifacts:/app/models_artifacts:ro
      - api_logs:/app/logs

    networks:
      - fraud-sentinel-network

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

    mem_limit: 3g
    cpus: 2.0

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

 
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        - API_BASE_URL=http://api:8000

    container_name: fraud-sentinel-dashboard
    ports:
      - "10101:10101"

    environment:
      - API_BASE_URL=http://api:8000
      - H2O_WAVE_ADDRESS=http://0.0.0.0:10101

    networks:
      - fraud-sentinel-network

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10101/_f/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    mem_limit: 1g
    cpus: 1.0

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  fraud-sentinel-network:
    driver: bridge

volumes:
  api_logs: