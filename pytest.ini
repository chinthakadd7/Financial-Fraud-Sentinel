[pytest]
# Pytest configuration for Financial Fraud Sentinel

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require API server running)
    slow: Slow tests (requires H2O initialization)
    api: API endpoint tests
    model: Model prediction tests
    dashboard: Dashboard tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Coverage options (if pytest-cov is installed)
# addopts = 
#     -v
#     --cov=src
#     --cov-report=html
#     --cov-report=term-missing

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Async support
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
